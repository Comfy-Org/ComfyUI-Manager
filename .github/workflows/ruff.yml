name: Python Linting

on: [push, pull_request]

jobs:
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.x

    - name: Install Ruff
      run: pip install ruff

    - name: Test startup dependency policy without a ComfyUI runtime
      run: python -m unittest discover -s tests/common -p test_dependency_management_flag.py -v

    - name: Run Ruff
      run: ruff check .
