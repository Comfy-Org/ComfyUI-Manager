name: Cleanup Music3 registration diff

on:
  push:
    branches:
      - register-minimax-music3-semantic-studio
    paths:
      - .github/workflows/cleanup-music3-registration.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: register-minimax-music3-semantic-studio
      - name: Restore unrelated formatting
        shell: python
        run: |
          from pathlib import Path
          path = Path("custom-node-list.json")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        {\n            "author": "DemonAlone",',
              '\t\t{\n            "author": "DemonAlone",',
              1,
          )
          text = text.replace(
              '            "pip": [\n                "opencolorio>=2.2.0",\n                "openexr>=3.2.0"\n            ]',
              '            "pip": ["opencolorio>=2.2.0", "openexr>=3.2.0"]',
              1,
          )
          path.write_text(text, encoding="utf-8")
      - name: Commit cleanup only
        run: |
          git config user.name "ukr8b3g-cmyk"
          git config user.email "ukr8b3g@gmail.com"
          git add custom-node-list.json
          git rm .github/workflows/cleanup-music3-registration.yml
          git commit -m "Keep Music3 Manager diff registration-only"
          git push origin HEAD:register-minimax-music3-semantic-studio
